services:
  mongodb:
    image: mongodb/mongodb-community-server:5.0-ubuntu2004
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - qdrant_data:/qdrant/storage
  lightrag-raganything:
    container_name: lightrag-raganything
    image: lightrag 
    entrypoint: ["lightrag-gunicorn"]
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - raganything
    ports:
      - "9630:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
    env_file:
      - .env-raganything
    restart: unless-stopped
    depends_on:
      - mongodb
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  mongo_data:
  qdrant_data:
